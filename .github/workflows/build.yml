name: Android CI / CD Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بضغطة زر من GitHub

jobs:
  build:
    name: Build & Export Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود المصدري من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java JDK 17 مع تفعيل التخزين المؤقت (Cache) لـ Gradle لتسريع البناء
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. إعطاء صلاحيات التشغيل لملف gradlew
      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      # 4. بناء التطبيق وتوليد ملف الـ APK
      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean :app:assembleDebug --stacktrace
          else
            gradle clean :app:assembleDebug --stacktrace
          fi

      # 5. رفع ملف الـ APK الناتج كملف جاهز للتحميل المباشر (Artifact)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-faces-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
